# Server
server.port=8081

# App Name
spring.application.name=jobmatch-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/jobmatch_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=parth
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=D:/JOB AI Project/backend/uploads